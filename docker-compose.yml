# Pinned rather than left to default to the checkout directory's basename -
# multiple clones of this repo (e.g. one per OS user) should all resolve to
# the same "netdoc" project name and therefore the same container/volume,
# regardless of what directory each one lives in.
name: netdoc

services:
  netdoc:
    image: ghcr.io/davewins/netdoc:latest   # or: build: .
    container_name: netdoc
    restart: unless-stopped
    # Host networking + NET_ADMIN/NET_RAW so the network-scan connector's
    # nmap ARP scan can see real devices on your LAN, not just Docker's
    # bridge network. This only works properly on a Linux Docker host -
    # Docker Desktop (Mac/Windows) doesn't give containers real host
    # network access, so scanning won't find LAN devices there.
    network_mode: host
    # Drop everything, then grant back only what nmap needs.
    cap_drop: [ALL]
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Values come from a .env file next to this file (docker compose) or from
    # the stack's "Environment variables" section (Portainer). Unset = default.
    environment:
      NETDOC_POLL_INTERVAL_SECONDS: ${NETDOC_POLL_INTERVAL_SECONDS:-300}
      # With network_mode: host this binds directly to a host port, so
      # override it if 8000 is already taken.
      NETDOC_PORT: ${NETDOC_PORT:-8000}
      # Optional secrets. Empty = netdoc generates and persists its own under
      # /data (master.key, mcp_token). If you pin the master key, back it up -
      # losing it makes stored credentials unrecoverable.
      NETDOC_MASTER_KEY: ${NETDOC_MASTER_KEY:-}
      NETDOC_MCP_TOKEN: ${NETDOC_MCP_TOKEN:-}
    volumes:
      - netdoc-data:/data

volumes:
  netdoc-data:
