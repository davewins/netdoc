# Pinned rather than left to default to the checkout directory's basename -
# multiple clones of this repo (e.g. one per OS user) should all resolve to
# the same "netdoc" project name and therefore the same container/volume,
# regardless of what directory each one lives in.
name: netdoc

services:
  netdoc:
    build: .
    container_name: netdoc
    restart: unless-stopped
    # Host networking + NET_ADMIN/NET_RAW so the network-scan connector's
    # nmap ARP scan can see real devices on your LAN, not just Docker's
    # bridge network. This only works properly on a Linux Docker host -
    # Docker Desktop (Mac/Windows) doesn't give containers real host
    # network access, so scanning won't find LAN devices there.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - netdoc-data:/data
    environment:
      # Poll every 5 minutes by default.
      NETDOC_POLL_INTERVAL_SECONDS: "300"
      # With network_mode: host, this binds directly to a port on the
      # host itself (not an isolated bridge network) - override via a
      # NETDOC_PORT=xxxx env var (or a .env file next to this compose
      # file, gitignored) if 8000 is already taken on this host.
      NETDOC_PORT: "${NETDOC_PORT:-8000}"
      # Optional: pin the encryption key instead of letting netdoc generate
      # and persist one at /data/master.key on first run. If you set this,
      # back it up - losing it makes stored credentials unrecoverable.
      # NETDOC_MASTER_KEY: ""

volumes:
  netdoc-data:
