services:
  netdoc:
    build: .
    container_name: netdoc
    restart: unless-stopped
    # Host networking + NET_ADMIN/NET_RAW so the network-scan connector's
    # nmap ARP scan can see real devices on your LAN, not just Docker's
    # bridge network. This only works properly on a Linux Docker host -
    # Docker Desktop (Mac/Windows) doesn't give containers real host
    # network access, so scanning won't find LAN devices there.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - netdoc-data:/data
    environment:
      # Poll every 5 minutes by default.
      NETDOC_POLL_INTERVAL_SECONDS: "300"
      # Optional: pin the encryption key instead of letting netdoc generate
      # and persist one at /data/master.key on first run. If you set this,
      # back it up - losing it makes stored credentials unrecoverable.
      # NETDOC_MASTER_KEY: ""

volumes:
  netdoc-data:
